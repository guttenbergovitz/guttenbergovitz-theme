# Guttenbergovitz theme for tmux
# Dark variant - warm, vintage-inspired colors

# Palette
thm_bg="#232326"
thm_bg_dark="#1d1d20"
thm_bg_light="#2a2a2d"
thm_fg="#d4be98"
thm_fg_dim="#7c7c7c"
thm_red="#a96b69"
thm_green="#89a87d"
thm_yellow="#d6b986"
thm_orange="#d79969"
thm_purple="#b194a3"
thm_cyan="#89b4ac"
thm_selection="#3a3a3d"

# Status bar
set -g status-style "bg=$thm_bg_dark,fg=$thm_fg"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=$thm_bg_dark,bg=$thm_orange,bold] #S #[fg=$thm_orange,bg=$thm_bg_dark]"
set -g status-right "#[fg=$thm_fg_dim]%Y-%m-%d #[fg=$thm_fg]%H:%M #[fg=$thm_green,bg=$thm_bg_dark]#[fg=$thm_bg_dark,bg=$thm_green,bold] #h "

# Window status
set -g window-status-format "#[fg=$thm_fg_dim,bg=$thm_bg_dark] #I:#W "
set -g window-status-current-format "#[fg=$thm_bg_dark,bg=$thm_yellow] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=$thm_selection"
set -g pane-active-border-style "fg=$thm_orange"

# Message style
set -g message-style "bg=$thm_bg_light,fg=$thm_fg"
set -g message-command-style "bg=$thm_bg_light,fg=$thm_fg"

# Mode style (copy mode, etc.)
set -g mode-style "bg=$thm_selection,fg=$thm_fg"

# Clock
set -g clock-mode-colour "$thm_orange"

# Bell
set -g window-status-bell-style "bg=$thm_red,fg=$thm_bg_dark"
