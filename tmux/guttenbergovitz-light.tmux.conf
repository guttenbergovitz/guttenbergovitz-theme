# Guttenbergovitz theme for tmux
# Light variant - warm, vintage-inspired colors

# Palette
thm_bg="#f5f3f0"
thm_bg_dark="#eae8e5"
thm_bg_light="#ffffff"
thm_fg="#5a4a3a"
thm_fg_dim="#a19f9e"
thm_red="#8b4c4a"
thm_green="#6b8860"
thm_yellow="#b8995a"
thm_orange="#b8784c"
thm_purple="#956d7e"
thm_cyan="#6b958f"
thm_selection="#e8e6e3"

# Status bar
set -g status-style "bg=$thm_bg_dark,fg=$thm_fg"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=$thm_bg,bg=$thm_orange,bold] #S #[fg=$thm_orange,bg=$thm_bg_dark]"
set -g status-right "#[fg=$thm_fg_dim]%Y-%m-%d #[fg=$thm_fg]%H:%M #[fg=$thm_green,bg=$thm_bg_dark]#[fg=$thm_bg,bg=$thm_green,bold] #h "

# Window status
set -g window-status-format "#[fg=$thm_fg_dim,bg=$thm_bg_dark] #I:#W "
set -g window-status-current-format "#[fg=$thm_bg,bg=$thm_yellow] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=$thm_selection"
set -g pane-active-border-style "fg=$thm_orange"

# Message style
set -g message-style "bg=$thm_bg_light,fg=$thm_fg"
set -g message-command-style "bg=$thm_bg_light,fg=$thm_fg"

# Mode style (copy mode, etc.)
set -g mode-style "bg=$thm_selection,fg=$thm_fg"

# Clock
set -g clock-mode-colour "$thm_orange"

# Bell
set -g window-status-bell-style "bg=$thm_red,fg=$thm_bg"
