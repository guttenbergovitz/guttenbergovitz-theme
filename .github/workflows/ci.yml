name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Palette check
        run: |
          python scripts/check_palette.py

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          for f in [
            'vscode/themes/guttenbergovitz-color-theme.json',
            'vscode/themes/guttenbergovitz-light-color-theme.json',
            'zed/guttenbergovitz.json',
            'opencode/guttenbergovitz.json',
            'pi/guttenbergovitz.json',
            'pi/guttenbergovitz-light.json',
            'claude-code/guttenbergovitz.json',
            'claude-code/guttenbergovitz-light.json',
            'kimi/guttenbergovitz.json',
            'kimi/guttenbergovitz-light.json',
            'palette.json',
          ]:
              with open(f) as fh:
                  json.load(fh)
              print('JSON OK:', f)
          PY

      - name: Validate TOML (Helix & Herdr)
        run: |
          python - <<'PY'
          import tomllib
          for f in [
            'helix/guttenbergovitz.toml',
            'helix/guttenbergovitz-light.toml',
            'herdr/guttenbergovitz.toml',
            'herdr/guttenbergovitz-light.toml',
          ]:
              tomllib.loads(open(f, 'r').read())
              print('TOML OK:', f)
          PY

      - name: Package VS Code extension (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build VS Code vsix
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd vscode
          npm install
          npm run package

      - name: Upload VS Code artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: vscode-vsix
          path: vscode/*.vsix

      - name: Zip JetBrains UI plugin (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd jetbrains/ui-theme/resources
          zip -r ../guttenbergovitz-ui-theme.zip .

      - name: Upload JetBrains UI theme zip
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-ui-theme
          path: jetbrains/ui-theme/guttenbergovitz-ui-theme.zip

      - name: Publish JetBrains plugin to Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl --fail --location --header "Authorization: Bearer ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}" \
            -F xmlId=com.guttenbergovitz.theme.ui \
            -F file=@jetbrains/ui-theme/guttenbergovitz-ui-theme.zip \
            https://plugins.jetbrains.com/plugin/uploadPlugin

